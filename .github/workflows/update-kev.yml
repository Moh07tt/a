name: Update CISA KEV intelligence snapshot

on:
  push:
    paths:
      - ".github/workflows/update-kev.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-kev-data
  cancel-in-progress: false

jobs:
  update-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Fetch and validate CISA advisories RSS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 - <<'PY'
          import datetime, json, pathlib, urllib.request, xml.etree.ElementTree as ET
          url = "https://www.cisa.gov/cybersecurity-advisories/all.xml"
          request = urllib.request.Request(url, headers={"User-Agent":"Mohammed-Al-Safi-Cyber-Intelligence/1.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              raw = response.read()
          root = ET.fromstring(raw)
          items = []
          for item in root.findall(".//item")[:30]:
              title = (item.findtext("title") or "").strip()
              link = (item.findtext("link") or "").strip()
              summary = (item.findtext("description") or "").strip()
              published = (item.findtext("pubDate") or "").strip()
              if title and link.startswith("https://"):
                  items.append({"source":"CISA","title":title,"url":link,"summary":summary[:700],"published":published})
          if not items:
              raise SystemExit("CISA advisory feed returned no usable items")
          payload = {"source":"CISA Cybersecurity Advisories RSS","generatedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),"items":items}
          pathlib.Path("data/global-threats.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")
          print(f"Validated {len(items)} public advisories.")
          PY
      - name: Commit advisory snapshot when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/global-threats.json
          if git diff --cached --quiet; then echo "Advisory snapshot is current."; exit 0; fi
          git commit -m "chore(data): refresh public CISA advisories"
          git push

  update-kev:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download and validate public CISA KEV catalog
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request

          urls = [
              "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json",
              "https://cdn.jsdelivr.net/gh/CISAGov/kev-data@develop/known_exploited_vulnerabilities.json",
          ]
          payload = None
          errors = []
          for url in urls:
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mohammed-Al-Safi-Cyber-Intelligence/1.0", "Accept": "application/json"},
                  )
                  with urllib.request.urlopen(request, timeout=25) as response:
                      candidate = json.load(response)
                  if not isinstance(candidate, dict) or not isinstance(candidate.get("vulnerabilities"), list):
                      raise ValueError("Unexpected KEV JSON structure")
                  if not candidate["vulnerabilities"]:
                      raise ValueError("The KEV catalog was empty")
                  payload = candidate
                  break
              except Exception as exc:
                  errors.append(f"{url}: {exc}")

          if payload is None:
              raise SystemExit("Unable to download a valid CISA KEV catalog. " + " | ".join(errors))

          output = pathlib.Path("data/kev.json")
          output.write_text(
              json.dumps(payload, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"Validated {len(payload['vulnerabilities'])} KEV records.")
          PY

      - name: Commit snapshot when changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kev.json
          if git diff --cached --quiet; then
            echo "KEV snapshot is already current."
            exit 0
          fi
          git commit -m "chore(data): refresh public CISA KEV snapshot"
          git push
